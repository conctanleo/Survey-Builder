# Voice Survey Nginx 配置
#
# 使用方法：
#   1. 将 YOUR_DOMAIN 替换为你的域名
#   2. 复制到 /etc/nginx/sites-available/voice-survey
#   3. ln -s /etc/nginx/sites-available/voice-survey /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d YOUR_DOMAIN

# ── 主应用（前端 + API）──

server {
    listen 80;
    server_name YOUR_DOMAIN;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # --- SSL 证书（Certbot 会自动填充）---
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- 安全头 ---
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- 客户端上传限制（录音文件最大 20MB）---
    client_max_body_size 20m;

    # --- 前端静态文件 ---
    root /opt/voice-survey/dist;
    index index.html;

    # SPA 路由：所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 构建的 assets/ 带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API 反向代理 → 主服务 3000 ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 注意：录音文件（受访者声纹 PII）不对公网暴露，
    # 收听走管理后台 8443 的认证接口 /api/recordings/file/...

    # --- 日志 ---
    access_log /var/log/nginx/voice-survey.access.log;
    error_log /var/log/nginx/voice-survey.error.log;
}

# ── 管理后台（独立端口，用同一份 SSL 证书）──
# 访问方式：https://YOUR_DOMAIN:8443
# 如不需要外部访问管理后台，可删除此块，改用 SSH 隧道：
#   ssh -L 3001:localhost:3001 user@server  → 浏览器打开 http://localhost:3001

server {
    listen 8443 ssl http2;
    server_name YOUR_DOMAIN;

    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
